[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-hedging-rough-vol"
version = "0.1.0"
description = "rBergomi Deep Hedging"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.4",
    "scipy==1.17.1",
    "jax==0.10.2",
    "jaxlib==0.10.2",
]

[project.optional-dependencies]
signatures = [
    "iisignature==0.24",
]
notebooks = [
    "matplotlib==3.10.8",
    "jupyterlab==4.5.6",
    "ipykernel==7.2.0",
    "nbformat==5.10.4",
]
deep = [
    "torch==2.11.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["data", "data.features", "data.simulated", "data.simulated.pricing", "theoreticalhedge", "LSTM"]
namespaces = true
